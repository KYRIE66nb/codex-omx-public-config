# oh-my-codex top-level settings (must be before any [table])
notify = ["node", "__OMX_NOTIFY_HOOK__"]
model_reasoning_effort = "xhigh"
developer_instructions = "You have oh-my-codex installed. AGENTS.md is your orchestration brain and the main orchestration surface. Use skill/keyword routing like $name plus spawned role-specialized subagents for specialized work. Codex native subagents are available via .codex/agents and may be used for independent parallel subtasks within a single session or team pane. Skills are loaded from installed SKILL.md files under .codex/skills, not from native agent TOMLs. Use workflow skills via $name when explicitly invoked or clearly routed by AGENTS.md. Treat installed prompts as narrower internal execution surfaces under AGENTS.md authority, even when user-facing docs prefer $name keywords."





model = "gpt-5.4"
disable_response_storage = true
sandbox_mode = "danger-full-access"
windows_wsl_setup_acknowledged = true
approval_policy = "never"
profile = "auto-max"
file_opener = "vscode"
skip_git_repo_check = true
model_provider = "OpenAI"
web_search = "cached"
suppress_unstable_features_warning = true

# MATLAB 超时配置：增加到 5 分钟（默认是 120 秒）
shell_timeout_sec = 300

review_model = "gpt-5.4"
network_access = "enabled"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
[model_providers.OpenAI]
name = "OpenAI"
base_url = "__OPENAI_BASE_URL__"
wire_api = "responses"
requires_openai_auth = true

[history]
persistence = "save-all"

[tui]
notifications = true
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit"]

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[sandbox_workspace_write]
network_access = true

[features]
plan_tool = true
apply_patch_freeform = true
view_image_tool = true
unified_exec = false
streamable_shell = false
rmcp_client = true
elevated_windows_sandbox = true

multi_agent = true
child_agents_md = true
[profiles.auto-max]
approval_policy = "never"
sandbox_mode = "danger-full-access"

[profiles.review]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[notice]
hide_gpt5_1_migration_prompt = true

[mcp_servers.openviking_memory]
url = "http://127.0.0.1:2033/mcp"
startup_timeout_sec = 10.0
[mcp_servers.drawio]
enabled = false
command = "npx"
args = ["-y", "@drawio/mcp"]
startup_timeout_sec = 120

[mcp_servers.next_drawio_live]
enabled = false
command = "node"
args = ["__HOME__/tmp/next-ai-draw-io/packages/mcp-server/dist/index.js"]
startup_timeout_sec = 30

[model_providers.gmn]
name = "gmn"
base_url = "https://cdn-gmn.chuangzuoli.com"

requires_openai_auth = true
[projects."__HOME__"]
trust_level = "trusted"

# OMX TUI StatusLine (Codex CLI v0.101.0+)
# NOTE: Codex config allows only one [tui] table. omx setup appended a second one,
# which breaks Codex parsing (duplicate key). Keep this as a comment; the real
# status_line is already configured in the primary [tui] section near the top.
# status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit"]

