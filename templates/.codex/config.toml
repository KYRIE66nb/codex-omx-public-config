# oh-my-codex top-level settings (must be before any [table])
notify = ["node", "__OMX_NOTIFY_HOOK__"]
model_reasoning_effort = "medium"
developer_instructions = "You have oh-my-codex installed. AGENTS.md is the orchestration brain and main control surface. Follow AGENTS.md for skill/keyword routing, $name workflow invocation, and role-specialized subagents. Use outcome-first, concise progress updates: state the target result, constraints, validation evidence, and stop condition before adding process detail. Native subagents live in .codex/agents and may handle independent parallel subtasks within one Codex session or team pane. Skills load from .codex/skills, not native-agent TOMLs. Treat installed prompts as narrower execution surfaces under AGENTS.md authority."


suppress_unstable_features_warning = true

# oh-my-codex seeded behavioral defaults (uninstall removes unchanged defaults)
model_context_window = 250000
model_auto_compact_token_limit = 200000
# End oh-my-codex seeded behavioral defaults

model_provider = "my_codex"
model = "gpt-5.5"
disable_response_storage = true

[model_providers.my_codex]
name = "my_codex"
base_url = "__OPENAI_BASE_URL__"
wire_api = "responses"
requires_openai_auth = true

[mcp_servers]
[projects."__HOME__"]
trust_level = "trusted"
[features]
multi_agent = true
child_agents_md = true
hooks = true
goals = true

[agents]
max_threads = 6
max_depth = 2

[mcp_servers.omx_code_intel]
type = "stdio"
command = "node"
args = ["__HOME__/.volta/tools/image/packages/oh-my-codex/lib/node_modules/oh-my-codex/dist/mcp/code-intel-server.js"]
enabled = true
startup_timeout_sec = 10

[mcp_servers.omx_memory]
type = "stdio"
command = "node"
args = ["__HOME__/.volta/tools/image/packages/oh-my-codex/lib/node_modules/oh-my-codex/dist/mcp/memory-server.js"]
enabled = true
startup_timeout_sec = 5

[mcp_servers.omx_state]
type = "stdio"
command = "node"
args = ["__HOME__/.volta/tools/image/packages/oh-my-codex/lib/node_modules/oh-my-codex/dist/mcp/state-server.js"]
enabled = true
startup_timeout_sec = 5

[mcp_servers.omx_trace]
type = "stdio"
command = "node"
args = ["__HOME__/.volta/tools/image/packages/oh-my-codex/lib/node_modules/oh-my-codex/dist/mcp/trace-server.js"]
enabled = true
startup_timeout_sec = 5

